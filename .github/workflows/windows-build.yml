name: Windows desktop build
on:
  push:
    branches: [windows-port]
  pull_request:
    branches: [windows-port]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Download Xray for Windows x64
        shell: pwsh
        run: |
          $version = "26.11.9"
          $archive = Join-Path $env:RUNNER_TEMP "xray-windows.zip"
          $extract = Join-Path $env:RUNNER_TEMP "xray-windows"
          Invoke-WebRequest "https://github.com/XTLS/Xray-core/releases/download/v$version/Xray-windows-64.zip" -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $extract -Force
          $binary = Get-ChildItem $extract -Recurse -Filter "xray.exe" | Select-Object -First 1
          if (-not $binary) { throw "xray.exe was not found in the official release archive" }
          $resource = "windows-app/src/main/resources/native/windows"
          New-Item -ItemType Directory -Force -Path $resource | Out-Null
          Copy-Item $binary.FullName (Join-Path $resource "xray.exe") -Force
      - name: Build Windows app
        run: .\\gradlew.bat -p windows-app test installDist
      - name: Package Windows executable
        run: jpackage --type app-image --name Chumpy --input windows-app/build/install/Chumpy-Windows/lib --main-jar Chumpy-Windows-0.1.0.jar --main-class slop.miho.chumpy.windows.MainKt --dest windows-app/build/package
      - name: Upload Windows distribution
        uses: actions/upload-artifact@v4
        with:
          name: Chumpy-Windows
          path: windows-app/build/package/Chumpy/
          if-no-files-found: error
